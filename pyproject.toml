[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "nested-space-cosmology"
version = "0.27.0"
description = "A mathematical atlas of nested regions, boundaries, fields, and interior observations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Douglas Ek" }]
keywords = [
  "cosmology",
  "black holes",
  "spectral geometry",
  "recursive geometry",
  "computational physics",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "python-flint==0.9.0",
  "mpmath==1.3.0",
  "numpy==2.5.1",
  "numba==0.68.0",
  "scipy==1.17.1",
  "sympy==1.14.0",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
paper = ["matplotlib==3.11.2", "reportlab==4.4.9", "zopfli==0.4.3"]
dev = ["pytest==9.1.1", "matplotlib==3.11.2", "reportlab==4.4.9", "zopfli==0.4.3"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: bounded slow scientific/replay checks",
  "cpu_budget: host-sensitive reference timing; run serially on an idle host",
  "external_data: requires exact SHA256-bound raw campaign inputs outside the checkout",
]

[tool.setuptools.package-data]
recursive_horizons = ["_angular_transport.cpp"]
