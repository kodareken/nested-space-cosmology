name: Focused draft PDF

on:
  pull_request:
    paths:
      - 'paper/local-gate-draft/**'
      - 'paper/local-gate-evidence/**'
      - 'scripts/*local_gate_draft.py'
      - '.github/workflows/draft-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focused-draft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install standard TeX and PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended poppler-utils
      - name: Build the OPEN draft twice and validate the artifacts
        run: |
          python scripts/build_local_gate_draft.py
          python scripts/verify_local_gate_draft.py
          python scripts/build_local_gate_draft.py --check
          mkdir -p paper/.build/draft-pages
          pdftoppm -r 90 -png paper/local-incoming-gate-draft.pdf paper/.build/draft-pages/page
          pdfinfo paper/local-incoming-gate-draft.pdf
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: local-incoming-gate-draft
          path: |
            paper/local-incoming-gate-draft.pdf
            paper/local-incoming-gate-draft-source.tar.gz
            paper/local-gate-draft-manifest.json
            paper/.build/draft-pages/*.png
          retention-days: 14
