name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -e '.[paper,dev]'
      - name: Verify repository boundary, focused tests, and paper
        run: make check test paper-check PYTHON=python

  historical-replay:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Enable long paths for original source layouts
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements-history.txt
      - name: Install the isolated historical renderer profile
        run: python -m pip install -r requirements-history.txt
      - name: Replay unchanged historical checkers and supporting editions
        run: python scripts/replay_history.py all
      - name: Retain original-producer output after replay failure
        if: failure()
        run: python scripts/diagnose_history_replay.py --version 5
      - name: Upload historical replay diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: historical-replay-diagnostics
          path: .build/history-diagnostics
          if-no-files-found: ignore

  prepared-atlas-replay:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-paper.txt
      - name: Install the preparation and response renderer profile
        run: python -m pip install -r requirements.txt -r requirements-paper.txt
      - name: Replay preparation and response in their original source contexts
        run: |
          python scripts/replay_history.py atlas-v7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/replay_history.py atlas-v8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
