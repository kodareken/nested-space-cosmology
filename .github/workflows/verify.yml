name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retained-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: Haswell
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
      - name: Expose tracked historical authentication objects
        shell: python
        run: |
          import os
          objects = os.path.join(os.environ["GITHUB_WORKSPACE"], "archive", "source-history", "objects")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("GIT_ALTERNATE_OBJECT_DIRECTORIES=" + objects + "\n")
      - name: Install pinned dependencies
        run: python -m pip install -e '.[paper,dev]'
      - name: Authenticate retained source pins and claim routing
        run: |
          python scripts/check_lab_snapshot.py
          python scripts/check_claim_bindings.py
      - name: Run every retained test
        run: python -m pytest tests/
      - name: Check the current paper
        run: python scripts/build_paper.py --check
