name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      reproduce_history:
        description: Recompute the historical scientific campaigns
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -e '.[paper,dev]'
      - name: Verify repository boundary, focused tests, and paper
        run: make check test paper-check draft-check PYTHON=python

  result-reproduction:
    if: github.event_name == 'workflow_dispatch' && inputs.reproduce_history
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned scientific dependencies
        run: python -m pip install -e .
      - name: Recompute the declared artifact chain
        env:
          TMPDIR: ${{ runner.temp }}
        run: make reproduce PYTHON=python JOBS=2
      - name: Preserve generated public result records if reproduction fails
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reproduction-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/nsc-public-reproduction-*/work/results/**/*.json
          if-no-files-found: ignore
          retention-days: 7
