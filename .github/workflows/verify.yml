name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # Preserve an active full-suite run while saving ongoing research commits.
  # GitHub keeps only the latest pending run for this group by default.
  cancel-in-progress: false

jobs:
  retained-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows needs about 48 minutes for the full suite plus the paper check.
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: Haswell
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
      - name: Expose tracked historical authentication objects
        shell: python
        run: |
          import os
          objects = os.path.join(os.environ["GITHUB_WORKSPACE"], "archive", "source-history", "objects")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("GIT_ALTERNATE_OBJECT_DIRECTORIES=" + objects + "\n")
      - name: Install pinned dependencies
        run: python -m pip install -e '.[paper,dev]'
      - name: Authenticate retained source pins and claim routing
        run: |
          python scripts/check_lab_snapshot.py
          python scripts/check_claim_bindings.py
          python scripts/check_prediction_register.py
      - name: Check result storage policy
        # The storage check inspects bytes and hashes, never scientific replay.
        run: |
          python scripts/check_result_storage.py
          python scripts/summarize_result.py --output results/summaries/nsc-atlas-cap-mass-direction-v1.json --check
          python scripts/summarize_result.py --output results/summaries/nsc-atlas-cap-mass-balance-v1.json --check
          python scripts/summarize_result.py --output results/summaries/nsc-atlas-cap-transport-balance-v1.json --check
      - name: Run every retained test
        run: python -m pytest tests/ --maxfail=5
      - name: Check the current paper
        run: python scripts/build_paper.py --check
