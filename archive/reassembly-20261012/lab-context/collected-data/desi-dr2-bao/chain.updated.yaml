theory:
  camb:
    version: 1.5.4
    path: null
    speed: 0.3
    stop_at_error: false
    extra_args:
      bbn_predictor: PArthENoPE_880.2_standard.dat
      dark_energy_model: ppf
      num_massive_neutrinos: 1
    ignore_obsolete: false
    use_renames: false
    external_primordial_pk: false
    renames:
      omegabh2: ombh2
      omegach2: omch2
      omegal: omega_de
      omegak: omk
      yhe: YHe
      yheused: YHe
      YpBBN: Y_p
    input_params:
    - As
    - ns
    - H0
    - ombh2
    - omch2
    - tau
    - mnu
    - nnu
    - w
    - wa
    - omk
    output_params:
    - omegam
    - omegal
    - zrei
    - YHe
    - Y_p
    - age
    - zdrag
    - DH
likelihood:
  desi_y3_cosmo_bindings.cobaya_likelihoods.bao_likelihoods_v1p2.desi_bao_all:
    path: /global/homes/c/crisjagq/desi-y3-kp/desi_y3_cosmo_bindings/cobaya_likelihoods
    measurements_file: bao_data_v1p2/desi_gaussian_bao_ALL_GCcomb_mean.txt
    cov_file: bao_data_v1p2/desi_gaussian_bao_ALL_GCcomb_cov.txt
    rs_fid: 1
    aliases:
    - BAO
    speed: 2000
    type: BAO
    rs_rescale: null
    prob_dist: null
    invcov_file: null
    redshift: null
    observable_1: null
    observable_2: null
    observable_3: null
    grid_file: null
    stop_at_error: false
    version: null
    python_path: /global/homes/c/crisjagq/desi-y3-kp
    input_params:
    - rdrag
    output_params: []
params:
  logA:
    latex: \ln(10^{10} A_\mathrm{s})
    drop: true
    value: 3.036
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
    derived: true
  ns:
    latex: n_\mathrm{s}
    value: 0.9649
  H0:
    latex: H_0
    value: 67.36
  ombh2:
    latex: \Omega_\mathrm{b} h^2
    value: 0.02237
    renames:
    - omegabh2
  omch2:
    value: 'lambda omm, mnu, ombh2, H0: omm*(H0/100)**2 - mnu / 93.14 - ombh2'
    latex: \Omega_\mathrm{c} h^2
    derived: true
    renames:
    - omegach2
  tau:
    latex: \tau_\mathrm{reio}
    value: 0.0544
  mnu:
    latex: \sum m_\nu
    value: 0.06
  nnu:
    latex: N_\mathrm{eff}
    value: 3.044
  w:
    prior:
      min: -3.0
      max: 1.0
    ref:
      dist: norm
      loc: -1.0
      scale: 0.02
    proposal: 0.02
    latex: w_{0}
  wa:
    latex: w_{a}
    value: 0.0
  omk:
    latex: \Omega_\mathrm{k}
    value: 0.0
    renames:
    - omegak
  omegam:
    latex: \Omega_\mathrm{m}
    derived: true
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  omegal:
    latex: \Omega_\Lambda
    derived: true
    renames:
    - omega_de
  zrei:
    latex: z_\mathrm{reio}
    derived: true
  YHe:
    latex: Y_\mathrm{P}
    derived: true
    renames:
    - yhe
    - yheused
  Y_p:
    latex: Y_P^\mathrm{BBN}
    derived: true
    renames:
    - YpBBN
  DHBBN:
    derived: 'lambda DH: 10**5*DH'
    latex: 10^5 \mathrm{D}/\mathrm{H}
  A:
    derived: 'lambda As: 1e9*As'
    latex: 10^9 A_\mathrm{s}
  clamp:
    derived: 'lambda As, tau: 1e9*As*np.exp(-2*tau)'
    latex: 10^9 A_\mathrm{s} e^{-2\tau}
  age:
    latex: \mathrm{Age}/\mathrm{Gyr}
    derived: true
  rdrag:
    value: 'lambda hrdrag, H0: 100 * hrdrag / H0'
    latex: r_\mathrm{d}
    derived: true
  zdrag:
    latex: z_\mathrm{d}
    derived: true
  H0rdrag:
    derived: 'lambda H0, rdrag: H0 * rdrag'
    latex: H_0 r_\mathrm{d}
  hrdrag:
    prior:
      min: 10.0
      max: 1000.0
    ref:
      dist: norm
      loc: 99.079
      scale: 1.0
    proposal: 1.0
    latex: hr_\mathrm{d}
  omm:
    prior:
      min: 0.01
      max: 0.99
    ref:
      dist: norm
      loc: 0.3152
      scale: 0.001
    proposal: 0.0005
    drop: true
  chi2__BAO:
    latex: \chi^2_\mathrm{BAO}
    derived: true
sampler:
  mcmc:
    burn_in: 0
    max_tries: 1000
    covmat: null
    covmat_params: null
    proposal_scale: 1.9
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: .inf
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.02
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    drag: false
    blocking:
    - - 1
      - - w
        - omm
    - - 2
      - - hrdrag
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: '3.5'
output: chain
version: '3.5'
