[frozen_theorem.kernel_criterion]
exact_identifiability_iff = "T annihilates ker(S)"
equivalent_factorization = "there exists A on range(S) with T=A composed_with S"
unboundedness_trigger = "there exists h in ker(S) with T(h) nonzero"
unboundedness_family = "f_A=f_0+A*h"
amplitude_is_unrestricted_without_an_external_norm_bound = true

[frozen_theorem.smooth_witness]
support_selection = "middle third of the widest adjacent-sample gap"
bump = "nonnegative nonzero phi in C_c_infinity of the selected gap"
witness = "h_A,k=A*phi*cos(2*pi*k*x)"
sample_values_and_all_sample_node_derivatives_vanish = true
target_identity = "hat(h_A,k)=A*(I_0+I_2k)/2"
strict_bound = "abs(I_2k)<I_0"
strictness_source = "nonconstant Fourier phase on positive-measure bump support"
derivative_identity = "hat(dh/dx)_k=2*pi*i*k*hat(h)_k"
every_declared_top_bin_must_receive_a_nonzero_coefficient = true

[frozen_theorem.uniform_alias_control]
sample_nodes = "x_j=j/63"
carrier_frequency = 63
witness = "sin(2*pi*63*x)*sin(2*pi*(63-k)*x)"
sample_annihilation_identity = "sin(2*pi*j)=0"
target_complex_coefficient = "1/4"
partner_frequency = "126-k"
partner_complex_coefficient = "-1/4"
unit_amplitude_positive_bin_field_power = "1/8"
all_five_declared_top_bins_required = true

[frozen_theorem.quantitative_regular_bound]
premise = "f in C1 with independently proved abs(f_prime)<=L"
piecewise_linear_coefficient_error = "L/2*sum_j Delta_j^2"
coarser_error = "L*h_max/2"
bound_is_uniform_in_frequency = true
