name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and paper dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-evolution.txt
          python -m pip install -r requirements-paper.txt
      - name: Run reproducibility gate
        run: make verify-portable-clean-clone PYTHON=python PAPER_PYTHON=python
